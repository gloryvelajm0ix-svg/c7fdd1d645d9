  PatternEnum:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/seed
      - run:
          name: The slow query log should be defragmented first
          command: |
            mkdir -p /tmp/seed
